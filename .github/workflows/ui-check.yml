name: Browser UI check (PR)

# 这个 workflow 只服务 PR。
#
# push main 时的门禁**不在这里** —— 它在 `deploy-pages.yml` 的 build job 里、部署之前。
# 原因：门禁必须与部署串在同一个 job 内，失败才能拦住部署；
# 拆成独立 workflow 并行跑的话，UI 断言红了 Pages 也已经上线了。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 只构建，不跑完整 npm test：UI 断言不涉及模型，没必要在 CI 里多算一遍 258MB 的 SHA-256。
      - run: npm run build

      # 起服务、起浏览器、跑断言写在同一个 step —— 后台进程跨 step 不保证存活。
      # 断言跑在 `vite preview`（构建产物）而不是 `npm run dev`（源码）上：
      # tree-shaking、压缩、import.meta.env 替换、?worker&inline 这些只在构建后才成形，
      # dev server 下永远测不到。
      - name: 起服务 + 无头 Chrome + 跑 UI 断言
        run: |
          set -euo pipefail

          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          preview_pid=$!
          chrome_pid=''
          trap 'kill "$preview_pid" ${chrome_pid:+"$chrome_pid"} 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "预览服务未就绪" >&2; cat /tmp/preview.log >&2; exit 1; fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "runner 上没有可用的 Chrome/Chromium" >&2; exit 1; fi
          echo "使用浏览器：$CHROME"

          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-profile \
            --window-size=402,874 http://127.0.0.1:4173/ > /tmp/chrome.log 2>&1 &
          chrome_pid=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9222/json/version > /dev/null; then break; fi
            if [ "$i" = 40 ]; then echo "Chrome CDP 未就绪" >&2; cat /tmp/chrome.log >&2; exit 1; fi
            sleep 1
          done

          TEST_URL_PREFIX=http://127.0.0.1:4173 CDP_PORT=9222 \
            node scripts/browser-ui-check.mjs

          # 与 deploy-pages.yml 的 build job 跑同一组：PR 阶段就拦住边界行为回归
          CHROME_PATH="$CHROME" TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-boundary-check.mjs
          CHROME_PATH="$CHROME" TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-stale-entry-check.mjs
          CHROME_PATH="$CHROME" TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-estimate-check.mjs

      - name: 确认浏览器测试夹具未残留
        run: |
          if [ -e dist/stale-entry-test.html ]; then
            echo "临时测试 HTML 残留在 dist/" >&2
            exit 1
          fi

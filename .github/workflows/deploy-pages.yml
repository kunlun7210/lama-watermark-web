name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser UI smoke test
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lama-vite.log 2>&1 &
          vite_pid=$!
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9223 --user-data-dir=/tmp/lama-chrome \
            http://127.0.0.1:4173/ > /tmp/lama-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$vite_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:9223/json/version >/dev/null && break
            sleep 1
          done
          SCREENSHOT_PATH=/tmp/lama-iphone17.png \
            TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-ui-check.mjs
          TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-boundary-check.mjs
          TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-stale-entry-check.mjs
          TEST_URL_PREFIX=http://127.0.0.1:4173 \
            node scripts/browser-estimate-check.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

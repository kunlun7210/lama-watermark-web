<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1422" />
    <!-- 添加到主屏幕（页脚建议的用法）后以独立窗口打开，并让内容延伸到状态栏/灵动岛下方。
         black-translucent 会把状态栏文字固定成白色 —— 本页是深色底，正好可读；
         若将来加浅色主题，这一条必须先改掉，否则状态栏文字会看不见。
         独立窗口下 env(safe-area-inset-top) 才会返回真值（iPhone 13 47pt / 15 Pro 59pt / 17 与 17 Pro 62pt），
         Safari 标签页里它通常是 0（地址栏本身已经占了位置），两种情形 style.css 里的 max() 都兜得住。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xiaolin去水印" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2370e0b6'/%3E%3Cpath d='M16 35h32M22 25h20M27 45h10' stroke='%23081420' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Xiaolin去水印</title>
    <style>
      html.sw-booting { background: #080d16; }
      html.sw-booting body { visibility: hidden; }
      html.sw-booting::after {
        content: '正在打开…';
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #aab5c8;
        font: 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      }
    </style>
    <script>
      window.coi = {
        coepCredentialless: () => false,
        coepDegrade: () => true,
        quiet: true,
      }
    </script>
    <script vite-ignore src="./offline-service-worker.js"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="eyebrow-row">
          <span class="eyebrow">本机浏览器推理 · 图片不会上传</span>
          <span class="app-version" id="app-version"></span>
        </div>
        <h1>Xiaolin去水印</h1>
        <p>目前支持去除 Gemini、豆包、即梦、千问、清言、元宝、文心、小红书水印；识别不到时保持原图。</p>
      </header>

      <section class="card transfer-card" id="transfer-card" hidden aria-live="polite">
        <div class="transfer-copy"><span id="transfer-title"></span><span id="transfer-detail"></span></div>
        <progress id="transfer-progress" max="1" value="0"></progress>
      </section>
      <section class="card controls">
        <div class="picker" id="picker" role="button" tabindex="0" aria-label="点这里选择图片">
          <span class="picker-icon" aria-hidden="true">＋</span>
          <span class="picker-title">点这里选择图片</span>
          <span class="picker-hint">可多选 · JPG / PNG / WebP / HEIC</span>
        </div>
        <input id="file-input" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif" />
        <div class="model-summary">
          <span class="model-summary-label">本地 AI 模型</span>
          <span class="model-summary-value"><strong id="current-model-label">LaMa INT8 · 62MB</strong><em id="cache-tag-current" class="model-cache-tag" hidden></em></span>
        </div>
        <p class="model-summary-hint">首次使用需在线下载；显示“已缓存”后可离线处理。</p>
        <details class="model-more">
          <summary>模型信息</summary>
          <div class="model-picker">
            <label class="model-option">
              <input class="model-choice-circle" type="radio" name="model" value="int8" checked disabled />
              <span>
                <span class="model-line"><strong>LaMa INT8 · 62MB</strong><em id="cache-tag-int8" class="model-cache-tag" hidden></em></span>
                <small>点选可缓存；下载和内存压力较小。</small>
              </span>
            </label>
            <label class="model-option">
              <input class="model-choice-circle" type="radio" name="model" value="fp32" disabled />
              <span>
                <span class="model-line"><strong>LaMa FP32 · 198MB</strong><em id="cache-tag-fp32" class="model-cache-tag" hidden></em></span>
                <small>点选可缓存；手机端不推荐，无明显提升。</small>
              </span>
            </label>
            <div id="cache-ocr" class="model-option ocr-model-option" role="button" tabindex="0" aria-disabled="true" aria-label="提前缓存 PP-OCRv6-small 文字识别模型">
              <span class="model-choice-circle" aria-hidden="true"></span>
              <span>
                <span class="model-line"><strong>PP‑OCRv6‑small · 30MB</strong><em id="cache-tag-ocr" class="model-cache-tag" hidden></em></span>
                <small id="ocr-model-hint">点选后提前缓存；识别时仍会自动使用。</small>
              </span>
            </div>
          </div>
        </details>
        <p id="selected-name" class="selected-name" hidden></p>
        <p id="batch-hint" class="batch-hint" hidden></p>
        <button id="run-batch" type="button" disabled>开始批量处理</button>
        <button id="save-album" type="button" hidden>存入相册</button>
        <button id="save-all" class="secondary" type="button" hidden>打包下载（ZIP）</button>
        <button id="stop" class="secondary" type="button" hidden>停止</button>
        <button id="clear" class="secondary" type="button" hidden>清空列表</button>
      </section>

      <div class="status-announcer" aria-live="polite" aria-atomic="true">
        <span id="status">等待选择图片</span>
        <span id="progress-label"></span>
        <progress id="progress" max="1" value="0"></progress>
        <dl id="metrics" class="metrics"></dl>
      </div>

      <section class="card queue-card" id="queue-card" hidden>
        <div class="queue-head">
          <strong>处理列表</strong>
          <span id="queue-summary"></span>
        </div>
        <ul id="queue" class="queue"></ul>
      </section>

      <section class="preview-grid" id="preview-grid" data-empty="true">
        <figure class="card">
          <figcaption>原图</figcaption>
          <canvas id="source"></canvas>
        </figure>
        <figure class="card">
          <figcaption>处理结果</figcaption>
          <canvas id="result"></canvas>
        </figure>
      </section>

      <p class="footnote">建议在 Wi-Fi 下把页面「添加到主屏幕」，本页会申请持久化存储以减少缓存被系统清理的可能。</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

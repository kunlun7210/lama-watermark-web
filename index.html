<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1422" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2370e0b6'/%3E%3Cpath d='M16 35h32M22 25h20M27 45h10' stroke='%23081420' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>LaMa 去水印 · iPhone 版</title>
    <script>
      window.coi = {
        coepCredentialless: () => false,
        coepDegrade: () => true,
        quiet: true,
      }
    </script>
    <script vite-ignore src="./coi-serviceworker.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <span class="eyebrow">本机浏览器推理 · 图片不会上传</span>
        <h1>LaMa 去水印 · iPhone 版</h1>
        <p>与 Mac 版同一套识别规则：豆包、即梦、千问、清言、元宝、文心、小红书。全部在手机浏览器内推理，图片不上传。</p>
      </header>

      <section class="card controls">
        <fieldset class="model-picker">
          <legend>选择模型</legend>
          <label class="model-option">
            <input type="radio" name="model" value="int8" checked />
            <span><strong>INT8 · 62MB</strong><small>下载和内存压力较小，画质接近 FP32</small></span>
          </label>
          <label class="model-option">
            <input type="radio" name="model" value="fp32" />
            <span><strong>FP32 · 198MB</strong><small>更接近现有 Mac 版，用于画质基准</small></span>
          </label>
        </fieldset>
        <label class="picker" for="file-input">
          <strong>选择一张带水印的图片</strong>
          <span>支持 JPG、PNG、WebP、HEIC；识别不到的水印会保持原图</span>
        </label>
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" />
        <p id="selected-name" class="selected-name" hidden></p>
        <button id="run" type="button" disabled>加载所选模型并处理</button>
        <button id="share" class="secondary" type="button" hidden>分享或保存结果</button>
        <a id="download" class="secondary link-button" hidden>下载 PNG</a>
      </section>

      <section class="card status-card" aria-live="polite">
        <div class="status-row">
          <span id="status">等待选择图片</span>
          <span id="progress-label"></span>
        </div>
        <progress id="progress" max="1" value="0"></progress>
        <dl id="metrics" class="metrics"></dl>
      </section>

      <section class="preview-grid">
        <figure class="card">
          <figcaption>原图</figcaption>
          <canvas id="source"></canvas>
        </figure>
        <figure class="card">
          <figcaption>LaMa-ONNX 结果</figcaption>
          <canvas id="result"></canvas>
        </figure>
      </section>

      <p class="footnote">与 Mac 版共用同一套规则：豆包、即梦（左上+右下双水印）、千问、清言、元宝、文心、小红书；识别不到时保持原图，不会猜测位置。首次打开会自动刷新一次以启用四线程。Gemini 专用还原暂未移植。</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
